name: Sync source data

on:
  schedule:
    - cron: "0 2 * * *" # 每天 10:00 CST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync new posts from source
        run: python3 sync_source_posts.py --no-rebuild

      - name: Validate posts.json
        run: python3 -c "import json; posts = json.load(open('media-data/posts.json')); print('posts', len(posts))"

      - name: Commit and push if changed
        id: push
        run: |
          if git diff --quiet -- media-data/posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "posts.json 未变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add media-data/posts.json
            git commit -m "chore(data): sync new posts from source"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 推送不会触发其他工作流，需显式 dispatch Pages 构建
      - name: Trigger Pages rebuild
        if: steps.push.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
